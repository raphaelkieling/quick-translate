<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>QuickTranslate Settings</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="settings">
    <form id="form">
      <div class="column">
        <fieldset>
          <legend>General</legend>
          <label>
            Theme
            <select name="theme">
              <option value="system">Same as macOS</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="checkbox">
            <input name="openAtLogin" type="checkbox" />
            Open at login
          </label>
          <label>
            Start in mode
            <select name="defaultMode">
              <option value="translate">Translate: main → second</option>
              <option value="explain">Explain: second → main</option>
            </select>
          </label>
          <label class="checkbox" title="Finds the language you type in with a quick call to the AI: your main language translates, a second language explains">
            <input name="realtimeMode" type="checkbox" />
            Real Time Mode: pick it from what I type
          </label>
        </fieldset>

        <fieldset>
          <legend>Languages</legend>
          <label>
            Main language
            <small>Your native language.</small>
            <input name="mainLanguage" list="languages" required />
          </label>
          <div class="field">
            <span class="field-title">Second languages</span>
            <small>Switch the one in use here or from the menu bar. The voice reads the answers aloud.</small>
            <ul id="second-languages"></ul>
            <div class="add-language">
              <input id="new-language" list="languages" placeholder="Add a language…" />
              <button id="add-language" type="button">Add</button>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="column">
        <fieldset>
          <legend>AI</legend>
          <label>
            OpenAI API key
            <input name="openaiApiKey" type="password" placeholder="sk-…" />
          </label>
          <label>
            Claude API key
            <input name="anthropicApiKey" type="password" placeholder="sk-ant-…" />
          </label>
          <label>
            Gemini API key
            <input name="googleApiKey" type="password" placeholder="AIza…" />
          </label>
          <label>
            Use
            <small>Only this one needs a key.</small>
            <select name="provider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Claude</option>
              <option value="google">Gemini</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>Anki</legend>
          <label class="checkbox">
            <input name="ankiEnabled" type="checkbox" />
            Add phrases to Anki with ⇧↵
          </label>
          <div class="anki-status">
            <span id="anki-status">Checking…</span>
            <button id="anki-refresh" type="button" class="link">Check again</button>
          </div>
          <div class="field">
            <span class="field-title">Decks</span>
            <small>Where the cards of each second language go.</small>
            <ul id="anki-decks"></ul>
          </div>
        </fieldset>
      </div>

      <div class="actions">
        <button type="submit">Save</button>
      </div>
    </form>

    <!-- Suggestions only: any language name works. -->
    <datalist id="languages">
      <option value="English"></option>
      <option value="Portuguese (Brazil)"></option>
      <option value="Portuguese (Portugal)"></option>
      <option value="Spanish"></option>
      <option value="French"></option>
      <option value="German"></option>
      <option value="Italian"></option>
      <option value="Dutch"></option>
      <option value="Japanese"></option>
      <option value="Korean"></option>
      <option value="Chinese (Simplified)"></option>
    </datalist>
    <script type="module" src="index.js"></script>
  </body>
</html>
