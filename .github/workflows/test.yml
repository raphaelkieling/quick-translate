name: Test

# Runs on pull requests, and before every release (release.yml calls it).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The tests don't need Electron or the native keyboard hook, so skip their downloads and builds.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test
